<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pull · Push 2 Debug Surface</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="push-hardware.css?v=shared-display">
    <link rel="stylesheet" href="push-surface.css?v=shared-display">
</head>
<body>
    <header class="toolbar">
        <div class="identity">
            <span class="mark" aria-hidden="true"></span>
            <div>
                <h1>Pull <span class="identity-label">/ Push 2</span></h1>
            </div>
        </div>
        <div class="status" aria-live="polite">
            <span class="status-dot"></span>
            <span id="event-status">Preview · ready</span>
        </div>
        <div class="toolbar-actions">
            <button id="demo-button" type="button">Demo lights</button>
            <button id="reset-button" type="button">Reset</button>
        </div>
    </header>

    <main>
        <section class="surface-frame" aria-label="Virtual Ableton Push 2 controller">
            <svg id="push-surface" viewBox="0 0 200 161.2" role="img" aria-labelledby="surface-title surface-description">
                <title id="surface-title">Interactive Push 2 debug surface</title>
                <desc id="surface-description">A mapped Push 2 controller with 64 pads, display, buttons, encoders, and touch strip.</desc>
                <defs>
                    <linearGradient id="panel-gradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#363637"/>
                        <stop offset="0.5" stop-color="#303031"/>
                        <stop offset="1" stop-color="#2a2a2b"/>
                    </linearGradient>
                    <filter id="pad-diffuser" x="-20%" y="-25%" width="140%" height="150%">
                        <feGaussianBlur stdDeviation="0.75"/>
                    </filter>
                    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="130%">
                        <feDropShadow dx="0" dy="1.4" stdDeviation="1.8" flood-color="#000" flood-opacity="0.4"/>
                    </filter>
                    <filter id="light-glow" x="-80%" y="-80%" width="260%" height="260%">
                        <feGaussianBlur stdDeviation="0.35" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <rect class="panel" x="1" y="1" width="198" height="159.2" rx="1" filter="url(#panel-shadow)"/>
                <rect class="panel-edge" x="1.5" y="1.5" width="197" height="158.2" rx="0.65"/>
                <path aria-hidden="true" fill="none" stroke="#bcbcb6" stroke-width="0.65"
                    d="M163 5.5v4.7M164.3 5.5v4.7M165.6 5.5v4.7M166.9 5.5v4.7M168.2 5.825h4.7M168.2 7.175h4.7M168.2 8.525h4.7M168.2 9.875h4.7"/>
                <g id="surface-controls"></g>

                <g id="display" aria-label="Push display">
                    <g id="display-placeholder" clip-path="url(#display-clip)">
                        <path class="display-grid" d="M36.5 33.93h120.25M36.5 40.61h120.25M51.53125 27.25v20.041667M66.5625 27.25v20.041667M81.59375 27.25v20.041667M96.625 27.25v20.041667M111.65625 27.25v20.041667M126.6875 27.25v20.041667M141.71875 27.25v20.041667"/>
                        <text class="display-kicker" x="38.75" y="31.55">PULL</text>
                        <text class="display-title" x="96.625" y="38.45" text-anchor="middle">DISPLAY · 960 × 160</text>
                        <text class="display-subtitle" x="96.625" y="43.35" text-anchor="middle">waiting for controller output</text>
                    </g>
                </g>

            </svg>
        </section>
        <aside class="pressure-control" aria-label="Pad pressure input">
            <div>
                <strong>Pad pressure</strong>
                <span id="pressure-target">Pad 1</span>
            </div>
            <input id="pressure-slider" type="range" min="0" max="127" value="0" step="1" aria-label="Pad pressure from 0 through 127">
            <output id="pressure-value" for="pressure-slider">0</output>
        </aside>
    </main>

    <script src="push-hardware.js?v=shared-display"></script>
    <script src="push-surface.js?v=shared-display"></script>
</body>
</html>
